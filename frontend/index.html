<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIKK AURA | Modern Luxury Living & Essentials</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      // Clean up any stale service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      // Auto-recover from stale chunks
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message.toLowerCase() : '';
        if (msg.indexOf('loading chunk') !== -1 || msg.indexOf('dynamically imported') !== -1 || msg.indexOf('mime type') !== -1) {
          if (!sessionStorage.getItem('na_chunk_retry')) {
            sessionStorage.setItem('na_chunk_retry', '1');
            window.location.reload();
          }
        }
      });
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #09090b;
        color: #f4f4f5;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      @keyframes na-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes na-pulse {
        0%, 100% { opacity: 0.6; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); }
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-sans antialiased selection:bg-amber-500 selection:text-zinc-950">
    <div id="root">
      <!-- Luxury Pre-Mount Fallback: Prevents any white flash -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #1c1917 0%, #09090b 70%); text-align: center; padding: 24px;">
        <div style="width: 64px; height: 64px; border-radius: 20px; background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.35); display: flex; align-items: center; justify-content: center; color: #f59e0b; font-weight: 900; font-size: 26px; margin-bottom: 20px; box-shadow: 0 0 45px rgba(245, 158, 11, 0.25); animation: na-pulse 3s infinite ease-in-out;">
          NA
        </div>
        <h1 style="font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; letter-spacing: 0.12em; margin: 0 0 10px 0; color: #ffffff;">
          NIKK <span style="color: #f59e0b; font-weight: 400; font-style: italic;">AURA</span>
        </h1>
        <p style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.3em; color: #a1a1aa; margin: 0 0 28px 0; font-weight: 600;">
          Entering Luxury Architecture &bull; Modern Living
        </p>
        <div style="width: 34px; height: 34px; border: 3px solid rgba(245, 158, 11, 0.2); border-top-color: #f59e0b; border-radius: 50%; animation: na-spin 0.85s linear infinite; margin-bottom: 32px;"></div>
        
        <noscript>
          <p style="color: #ef4444; font-size: 13px; max-width: 380px;">JavaScript is required to experience NIKK AURA. Please enable JavaScript in your browser settings.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
